<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hand-authored fixture</title>
<script src="translate-element.js"></script>
</head>
<body>
<translate-element></translate-element>

<h1 lang="en" id="heading-en">Welcome</h1>
<h1 lang="sv" id="heading-sv">Välkommen</h1>
<h1 lang="de" id="heading-de">Willkommen</h1>

<p lang="en" id="para-en">Hello there</p>
<p lang="fr" id="para-fr">Bonjour</p>

<span lang="en" id="orphan">Nobody translated me</span>

<form method="get" action="./" id="query">
 <fieldset class="with">
  <select name="withOnly" id="withOnly">
   <option label=" " value=""></option>
   <option value="1" lang="fi">yksin</option><option value="1" lang="en">alone</option>
   <option value="2" lang="fi">kumppanin</option><option value="2" lang="en">partner</option>
   <option value="3" lang="fi">vanhemman</option><option value="3" lang="en">parent</option>
   <option value="4" lang="fi">lasten</option><option value="4" lang="en">kids</option>
   <option value="5" lang="fi">perheen</option><option value="5" lang="en">family</option>
   <option value="6" lang="fi">muiden</option><option value="6" lang="en">others</option>
  </select>
 </fieldset>
 <fieldset class="with">
  <legend>
   <span lang="fi">Kanssa (ainakin)</span><span lang="en">With at least</span>
  </legend>
  <input id="withpartner" name="with[]" value="2" type="checkbox">
  <label for="withpartner"><span lang="fi">kumppanin</span><span lang="en">partner</span></label>
  <input id="withparent" name="with[]" value="3" type="checkbox">
  <label for="withparent"><span lang="fi">vanhemman</span><span lang="en">parent</span></label>
  <input id="withkids" name="with[]" value="4" type="checkbox">
  <label for="withkids"><span lang="fi">lasten</span><span lang="en">kids</span></label>
  <input id="withfamily" name="with[]" value="5" type="checkbox">
  <label for="withfamily"><span lang="fi">perheen</span><span lang="en">family</span></label>
  <input id="withothers" name="with[]" value="6" type="checkbox">
  <label for="withothers"><span lang="fi">muiden</span><span lang="en">others</span></label>
 </fieldset>
 <input lang="fi" type="submit" id="submitFi" value="Hae">
 <input lang="en" type="submit" id="submit" value="Get">
</form>
</nav>

</body>
</html>
