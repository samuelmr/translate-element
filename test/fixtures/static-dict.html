<!doctype html>
<html>
<head>

<title lang="en">Page title</title>
<script src="translate-element.js"></script>
</head>
<body>

<input lang="en" id="text-input" type="text" placeholder="Enter your name" title="Enter your name">

</select>

<input lang="en" id="submit-button" type="submit" value="Submit">

</body>
</html>
