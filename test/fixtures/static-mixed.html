<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mixed fixture</title>
<script src="translate-element.js"></script>
</head>
<body>
<translate-element src="translations.json"></translate-element>

<h1 lang="en" id="heading">Welcome</h1>
<h1 lang="sv" id="heading-sv">Välkommen hit</h1>

<h2 lang="de" id="cancel-de">Abbruch</h2>

<input lang="sv" id="name-sv" placeholder="Ditt namn">

<p lang="en" id="hello">Hello there</p>
<p lang="en" id="submit">Submit</p>

<span lang="en" id="untranslated-b">Second untranslated</span>

</html>
