<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mixed fixture</title>
<script src="translate-element.js"></script>
</head>
<body>
<translate-element src="translations.json"></translate-element>

<h1 lang="en" id="heading">Welcome</h1>
<h1 lang="sv" id="heading-sv">Välkommen hit</h1>

<h2 lang="de" id="cancel-de">Abbruch</h2>
<h2 lang="en" id="cancel">Cancel</h2>

<input lang="en" id="name" placeholder="Enter your name">
<input lang="sv" id="name-sv" placeholder="Ditt namn">

<p lang="en" id="hello">Hello there</p>
<p lang="en" id="submit">Submit</p>

<span lang="en" id="untranslated-a">First untranslated</span>
<span lang="en" id="untranslated-b">Second untranslated</span>

<div id="follow">
<p lang="en" id="follow-a">Own A</p>
<p lang="sv" id="follow-a-sv">Eget A</p>
<p lang="en" id="follow-b">Hello there</p>
<p lang="de" id="follow-b-de">Eigen B</p>
</div>

<div id="precede">
<p lang="sv">Hand hej</p>
<p lang="en" id="precede-a">Hello there</p>
<p lang="sv">Hand välkommen</p>
<p lang="en" id="precede-b">Welcome</p>
</div>

<div id="group">
<p lang="en" id="group-a">Group A</p>
<p lang="en" id="group-b">Group B</p>
<p lang="sv" id="group-c">Grupp C</p>
</div>
</body>
</html>
